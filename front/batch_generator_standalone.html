<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量生成凭证文件</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f6f8;
            color: #24292f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .container {
            width: min(1080px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            line-height: 1.25;
        }

        h3,
        h4 {
            margin-top: 0;
        }

        .panel {
            padding: 20px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            background: #fff;
        }

        .section {
            margin-bottom: 20px;
            padding: 18px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            background: #f8f9fa;
        }

        input[type="password"],
        input[type="text"],
        input[type="url"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #57606a;
            font-size: 13px;
            font-weight: 600;
        }

        .field-grid {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(220px, 0.7fr) auto;
            gap: 12px;
            align-items: end;
        }

        .btn {
            border: none;
            border-radius: 6px;
            background: #0969da;
            color: #fff;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn:hover:not(:disabled) {
            background: #0757b8;
        }

        .btn:disabled {
            background: #8c959f;
            cursor: not-allowed;
        }

        .upload-area {
            border: 2px dashed #28a745;
            border-radius: 8px;
            padding: 28px;
            text-align: center;
            background: #fff;
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }

        .file-list {
            margin: 10px 0;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: #fff;
        }

        .remove-btn {
            border: none;
            border-radius: 6px;
            background: #cf222e;
            color: #fff;
            padding: 8px 10px;
            cursor: pointer;
            white-space: nowrap;
        }

        .status {
            margin: 12px 0;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: #fff;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status.success {
            border-color: #2da44e;
            background: #dafbe1;
            color: #116329;
        }

        .status.warning {
            border-color: #d4a72c;
            background: #fff8c5;
            color: #7d4e00;
        }

        .status.error {
            border-color: #cf222e;
            background: #ffebe9;
            color: #82071e;
        }

        .log-box {
            min-height: 140px;
            max-height: 360px;
            overflow-y: auto;
            padding: 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: #fff;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 640px) {
            .container {
                width: min(100% - 20px, 1080px);
                padding: 14px 0;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .action-row {
                display: flex;
                gap: 8px;
            }

            .field-grid {
                grid-template-columns: 1fr;
            }

            .action-row .btn {
                flex: 1 1 0;
                min-width: 0;
                padding: 10px 8px;
                font-size: 12px;
                line-height: 1.25;
                white-space: normal;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="mainSection">
            <div class="topbar">
                <h1>批量生成凭证文件</h1>
            </div>

            <div class="section">
                <h4 style="color: #0969da; border-bottom: 2px solid #0969da; padding-bottom: 8px;">远程服务连接</h4>
                <div class="field-grid">
                    <div>
                        <label for="originBaseUrl">远程服务地址</label>
                        <input type="url" id="originBaseUrl" placeholder="http://127.0.0.1:7861" autocomplete="off" />
                    </div>
                    <div>
                        <label for="originPanelToken">连接密码</label>
                        <input type="password" id="originPanelToken" placeholder="输入远程服务连接密码" autocomplete="off" />
                    </div>
                    <button type="button" class="btn" id="saveOriginConfigBtn" onclick="saveOriginConfig()">
                        保存连接配置
                    </button>
                </div>
                <div id="originConfigStatus" class="status" style="display: none;"></div>
            </div>

            <div class="section">
                <h4 style="color: #0969da; border-bottom: 2px solid #0969da; padding-bottom: 8px;">代理设置</h4>
                <div style="display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 260px; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff;">
                        <div style="color: #57606a; font-size: 13px; margin-bottom: 6px;">当前登录代理地址</div>
                        <div id="batchGenerateProxyUrl" style="font-family: monospace; font-size: 13px; word-break: break-all;">
                            未生成代理地址
                        </div>
                    </div>
                    <button type="button" class="btn" id="batchGenerateSwitchProxyBtn"
                        onclick="window.BatchGenerate.switchProxy()" style="white-space: nowrap;">
                        切换代理地址
                    </button>
                </div>
                <div id="batchGenerateProxyStatus" class="status" style="display: none;"></div>
            </div>

            <div class="section">
                <h4 style="color: #1a7f37; border-bottom: 2px solid #1a7f37; padding-bottom: 8px;">上传账号文件</h4>
                <div class="upload-area" id="batchGenerateUploadArea"
                    onclick="document.getElementById('batchGenerateFileInput').click()"
                    ondragover="window.BatchGenerate.handleDragOver(event)"
                    ondragleave="window.BatchGenerate.handleDragLeave(event)"
                    ondrop="window.BatchGenerate.handleFileDrop(event)">
                    <p>点击选择文件或拖拽文件到此区域</p>
                    <p style="color: #57606a; font-size: 14px;">只支持上传一个 .txt 文件</p>
                    <p style="color: #6e7781; font-size: 12px;">每行格式：谷歌账号|密码|2fa密钥|手机号|手机号验证码获取链接</p>
                </div>

                <input type="file" id="batchGenerateFileInput" accept=".txt,text/plain" style="display: none;"
                    onchange="window.BatchGenerate.handleFileSelect(event)" />

                <div id="batchGenerateFileListSection" class="hidden">
                    <h4>选择的文件：</h4>
                    <div class="file-list" id="batchGenerateFileList"></div>
                </div>

                <div class="action-row" style="display: flex; gap: 12px; margin-top: 16px;">
                    <button type="button" class="btn" id="batchGenerateGcliStartBtn"
                        onclick="window.BatchGenerate.start('geminicli')" style="display: none; flex: 1 1 220px;">
                        开始生成GCLI凭证
                    </button>
                    <button type="button" class="btn" id="batchGenerateAntigravityStartBtn"
                        onclick="window.BatchGenerate.start('antigravity')" style="flex: 1 1 220px;">
                        开始生成Antigravity
                    </button>
                </div>

                <div id="batchGenerateAccountStatus" class="status" style="display: none;"></div>

                <div style="margin-top: 18px;">
                    <h4>生成日志</h4>
                    <div id="batchGenerateLogContent" class="log-box">等待开始生成...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ORIGIN_BASE_URL_KEY = 'gcli2api_base_url';
        const ORIGIN_PANEL_TOKEN_KEY = 'gcli2api_panel_token';
        const ORIGIN_PANEL_TOKEN_CONFIGURED_KEY = 'gcli2api_panel_token_configured';
        const AppState = {
            currentConfig: {}
        };

        function getAuthHeaders() {
            return {
                'Content-Type': 'application/json'
            };
        }

        function formatFileSize(bytes) {
            const value = Number(bytes) || 0;
            if (value < 1024) return `${value} B`;
            if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
            return `${(value / 1024 / 1024).toFixed(1)} MB`;
        }

        function showStatus(message, type = 'info') {
            const section = document.getElementById('batchGenerateAccountStatus');
            if (!section) return;
            if (!message) {
                section.style.display = 'none';
                section.textContent = '';
                section.className = 'status';
                return;
            }
            section.style.display = 'block';
            section.className = `status ${type}`;
            section.textContent = message;
        }

        function showProxyStatus(message, type = 'info') {
            const section = document.getElementById('batchGenerateProxyStatus');
            if (!section) return;
            if (!message) {
                section.style.display = 'none';
                section.textContent = '';
                section.className = 'status';
                return;
            }
            section.style.display = 'block';
            section.className = `status ${type}`;
            section.textContent = message;
        }

        function showOriginConfigStatus(message, type = 'info') {
            const section = document.getElementById('originConfigStatus');
            if (!section) return;
            if (!message) {
                section.style.display = 'none';
                section.textContent = '';
                section.className = 'status';
                return;
            }
            section.style.display = 'block';
            section.className = `status ${type}`;
            section.textContent = message;
        }

        function updateOriginConfigFields(config = {}, originError = '') {
            const baseUrlInput = document.getElementById('originBaseUrl');
            const tokenInput = document.getElementById('originPanelToken');
            const baseUrl = config[ORIGIN_BASE_URL_KEY] || '';
            const tokenConfigured = Boolean(config[ORIGIN_PANEL_TOKEN_CONFIGURED_KEY]);

            if (baseUrlInput && document.activeElement !== baseUrlInput) {
                baseUrlInput.value = baseUrl;
            }
            if (tokenInput) {
                tokenInput.value = '';
                tokenInput.placeholder = tokenConfigured ? '已配置，留空不修改' : '输入远程服务连接密码';
            }

            if (originError) {
                showOriginConfigStatus(originError, 'warning');
            } else if (baseUrl && tokenConfigured) {
                showOriginConfigStatus('远程服务连接配置已生效', 'success');
            } else {
                showOriginConfigStatus('');
            }
        }

        async function loadStandaloneConfig() {
            const response = await fetch('./config/get', { headers: getAuthHeaders() });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || data.error || '加载配置失败');

            AppState.currentConfig = data.config || {};
            updateOriginConfigFields(AppState.currentConfig, data.origin_config_error || '');
            return data;
        }

        async function saveOriginConfig() {
            const button = document.getElementById('saveOriginConfigBtn');
            const baseUrl = document.getElementById('originBaseUrl').value.trim().replace(/\/+$/, '');
            const panelToken = document.getElementById('originPanelToken').value.trim();
            const originalText = button ? button.textContent.trim() : '';
            const config = { [ORIGIN_BASE_URL_KEY]: baseUrl };

            if (panelToken) {
                config[ORIGIN_PANEL_TOKEN_KEY] = panelToken;
            }

            try {
                if (button) {
                    button.disabled = true;
                    button.textContent = '保存中...';
                }
                const response = await fetch('./config/save', {
                    method: 'POST',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ config })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || data.error || '保存失败');

                showOriginConfigStatus('远程服务连接配置已保存', 'success');
                await loadStandaloneConfig();
                if (window.BatchGenerate) await window.BatchGenerate.load();
            } catch (error) {
                showOriginConfigStatus(`保存远程服务连接配置失败: ${error.message}`, 'error');
            } finally {
                if (button) {
                    button.disabled = false;
                    button.textContent = originalText || '保存连接配置';
                }
            }
        }

        async function initializeMain() {
            await loadStandaloneConfig();
            if (window.BatchGenerate) await window.BatchGenerate.load();
        }

        async function initializePage() {
            try {
                await initializeMain();
            } catch (error) {
                showOriginConfigStatus(`加载配置失败: ${error.message}`, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
    <script src="./front/batch_generate.js?v=batch-generate-standalone-6"></script>
</body>

</html>
