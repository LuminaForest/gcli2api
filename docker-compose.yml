services:
  postgres:
    image: postgres:16-alpine
    container_name: gcli2api-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-T9#vQ2mL8}
      - POSTGRES_DB=${POSTGRES_DB:-gcli}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  gcli2api:
    image: tummifix/gcli2api:latest
    container_name: gcli2api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-7861}:${PORT:-7861}"
    environment:
      # Password configuration (choose one)
      # Option 1: Use common password
      # - PASSWORD=${PASSWORD:-pwd}
      # Option 2: Use separate passwords (uncomment if needed)
      - API_PASSWORD=${API_PASSWORD:-Q7mX9vLp2Kc8}
      - PANEL_PASSWORD=${PANEL_PASSWORD:-tR4zN8yHq1Wd}

      # Server configuration
      - PORT=${PORT:-7861}
      - HOST=${HOST:-0.0.0.0}

      # Optional: Google credentials from environment
      # - GOOGLE_CREDENTIALS=${GOOGLE_CREDENTIALS}

      # Optional: Logging configuration
      # - LOG_LEVEL=${LOG_LEVEL:-info}

      # Optional: Redis configuration (for distributed storage)
      # - REDIS_URI=${REDIS_URI}
      # - REDIS_DATABASE=${REDIS_DATABASE:-0}

      # Optional: MongoDB configuration (for distributed storage)
      # - MONGODB_URI=${MONGODB_URI}
      # - MONGODB_DATABASE=${MONGODB_DATABASE:-gcli2api}

      # PostgreSQL configuration (for distributed storage)
      - POSTGRESQL_URI=${POSTGRESQL_URI:-postgresql://postgres:T9%23vQ2mL8@postgres:5432/gcli}

      # Optional: Proxy configuration
      # - PROXY=${PROXY}
    volumes:
      - ./data/creds:/app/creds

